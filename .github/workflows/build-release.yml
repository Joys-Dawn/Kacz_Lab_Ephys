name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build with PyInstaller
        run: pyinstaller ephys_analysis.spec

      - name: Zip output
        shell: pwsh
        run: Compress-Archive -Path dist/Kacz_Lab_Ephys/* -DestinationPath Kacz_Lab_Ephys-windows.zip

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: Kacz_Lab_Ephys-windows.zip
