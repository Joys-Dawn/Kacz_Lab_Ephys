[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ephys-analysis"
version = "1.3.0"
description = "Automated electrophysiology analysis for patch-clamp recordings"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "pyabf>=2.3",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.2",
    "pyinstaller>=6.0",
]

[project.scripts]
ephys-analysis = "ephys_analysis.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
